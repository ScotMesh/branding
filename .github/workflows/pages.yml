name: Brand site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site with the real asset files
        run: |
          mkdir -p _site/src/fonts
          cp -r site/. _site/
          cp -r logo wordmark networks github discord facebook youtube x-mastodon bluesky social web groups _site/
          cp src/fonts/OFL.txt _site/src/fonts/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
